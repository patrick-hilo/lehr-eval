{% extends "base.html" %}

{% set role_label = "Lehrkraft" %}
{% set hide_header = false %}
{% block title %}Lehrkraft-PIN{% endblock %}

{% block content %}
<div class="auth-shell">
  <div class="auth-card">
    <h1>Lehrkraft-PIN</h1>
    <p class="lede">Bitte gib deine vierstellige PIN ein, um die Steuerung zu oeffnen.</p>
    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}
    <form method="post" action="/t/{{ teacher_token }}">
      <label class="field">
        <span class="field-label">PIN</span>
        <input id="pin" name="pin" inputmode="numeric" pattern="[0-9]*"
               autocomplete="one-time-code" required autofocus>
      </label>
      <div class="actions">
        <button type="submit">Anmelden</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
